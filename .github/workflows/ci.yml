name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限原则（终审 round4 Minor）：本 workflow 只需读代码，显式收窄默认 token
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Install protoc (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc -y

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Check frontend build
        run: npx vite build

      - name: Prepare MCP server resources
        run: |
          npm --prefix mcp-server ci
          npm run mcp:build

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo build

  # src-server 集成测试：起 PG(pgvector)+ Redis,跑 lib 单测 + integration
  # binary 的非 ignored 子集。#[ignore] 测试硬依赖本地 omlx(@8001 bge-m3)
  # 或预播种的 project 249,CI 无法提供 → 留作本地 `cargo test -- --ignored`。
  src-server-test:
    name: src-server (PG + Redis)
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: llmwiki
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: llmwiki
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # sqlx migrate run 与 config/default.json 都指向 localhost:5433
      DATABASE_URL: postgres://llmwiki:test123@localhost:5433/llmwiki

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # reqwest 默认 native-tls → 需 libssl;sqlx 已用 rustls 不受影响
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-server

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      # create_app 不自动建表,必须显式 migrate（含 CREATE EXTENSION vector）
      - name: Run migrations
        working-directory: src-server
        run: sqlx migrate run

      - name: cargo test (lib + integration)
        working-directory: src-server
        run: cargo test --lib --test integration

  # JS 测试补覆盖：check 只验证 vite build,根 vitest(2239 个 mock 用例)
  # 与 mcp-server 的 node --test 从不进 CI → 此 job 补齐。
  # LLM 门控：只跑 test:mocks,该脚本自带 --exclude '**/*.real-llm.test.ts'
  # 文件名排除。真实 LLM 用例依赖 .env.test.local 凭证/局域网端点,无凭证
  # 时虽是 skipIf/可达性探测跳过而非 fail,但整文件 skip 等于零信号,还会
  # 对 192.168.x.x 做网络探测;故 CI 用文件名排除确定性挡住,test:llm
  # 留作本地 `npm test` 时跑。vitest 无独立配置,复用 vite.config.ts 的
  # test 段(其 .env.test.local 加载器对缺失文件是 no-op,CI 安全)。
  frontend-test:
    name: vitest + mcp-server
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 与 check job 保持一致用 npm install(仓库虽有 package-lock.json,
      # 但既有约定如此,不单独引入 npm ci)
      - name: Install frontend dependencies
        run: npm install

      # mock 子集全量:本地 164 文件 / 2239 用例 ≈ 12s
      - name: Run vitest (mock subset)
        run: npm run test:mocks

      # mcp-server 测试跑编译产物而非源码,须先 ci 装依赖
      - name: Install mcp-server dependencies
        run: npm --prefix mcp-server ci

      # 根脚本 mcp:test = 先 tsc build 再 node --test dist/test/*.test.js
      # (本地 65/65),测试命令内部已含构建,无需单独 mcp:build 步
      - name: Test mcp-server (node --test)
        run: npm run mcp:test
